[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-chain"
version = "1.0.0"
description = "Provider-agnostic LLM calls with a cross-model fallback chain, retry policy and wall-clock budget valve."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "josephararil" }]
keywords = ["llm", "gemini", "anthropic", "fallback", "retry"]

# requests is the ONLY runtime dependency, and that is load-bearing rather than
# incidental: this module is consumed by several unrelated pipelines, so every
# dependency added here is imposed on all of them. stdlib + requests, nothing else.
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/josephararil/llm-chain"

# ONE top-level module, not a package directory. Consumers' existing
# `import llm_chain as L` must keep working verbatim after the extraction, so the
# import path may not gain a package prefix. Do not convert this to a src/ layout
# or an llm_chain/ package -- that renames the import for every consumer.
[tool.setuptools]
py-modules = ["llm_chain"]
